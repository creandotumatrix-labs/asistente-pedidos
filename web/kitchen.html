<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Ops</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{ --p:#FF8000; --a:#47C7FC; --bg1:#0a0b10; --bg2:#12141d;
    --ink:#eaecf2; --muted:#8b93a3; --line:rgba(255,255,255,.1);
    --pickup:#f5a524; --delivery:#3b82f6; --dine_in:#22c55e; --green:#22c55e; --red:#ef4444; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:linear-gradient(to bottom right,var(--bg1),var(--bg2),var(--bg1));color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  .glass{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:1rem}
  .tint{background:color-mix(in srgb,var(--p) 18%,transparent);color:var(--p)}
  .txt-p{color:var(--p)} .txt-a{color:var(--a)}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;position:sticky;top:0;z-index:5;
    background:rgba(10,11,16,.7);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:42px;height:42px;border-radius:.7rem;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--p) 20%,transparent);color:var(--p);flex-shrink:0}
  .brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
  .brand .sub{font-size:11.5px;color:var(--muted);margin-top:1px}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:12px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:#415063}
  .dot.live{background:var(--green);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .spacer{flex:1}
  .stats{display:flex;gap:10px}
  .stat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:.8rem;padding:7px 14px;text-align:center;min-width:76px}
  .stat b{display:block;font-size:19px;line-height:1.1;color:#fff;font-variant-numeric:tabular-nums}
  .stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .btn{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);border-radius:.6rem;padding:8px 12px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--p)}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:.6rem;overflow:hidden;background:rgba(255,255,255,.05)}
  .lang button{background:transparent;color:var(--muted);border:0;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .lang button.on{background:var(--p);color:#0a0b10}
  main{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;padding:16px 22px 40px;align-items:start}
  @media(max-width:920px){main{grid-template-columns:1fr}}
  .panel{display:flex;flex-direction:column;min-height:0}
  .phead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .phead .ic{width:30px;height:30px;border-radius:.55rem;display:grid;place-items:center;font-size:14px}
  .phead h2{font-size:14px;margin:0;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
  .phead .cnt{margin-left:auto;font-size:11px;color:var(--muted);font-family:ui-monospace,monospace}
  /* agent stream */
  #stream{padding:14px 16px;display:flex;flex-direction:column;gap:9px;max-height:74vh;overflow-y:auto;scroll-behavior:smooth}
  #stream::-webkit-scrollbar{width:8px}#stream::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}
  .ev{animation:slide .32s ease both}
  @keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .bubble{max-width:88%;padding:9px 12px;border-radius:13px;font-size:13.5px;line-height:1.42}
  .who{font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;display:flex;align-items:center;gap:5px;opacity:.85}
  .ev-user{align-self:flex-end}.ev-user .bubble{background:color-mix(in srgb,var(--green) 20%,transparent);border:1px solid color-mix(in srgb,var(--green) 30%,transparent);border-bottom-right-radius:4px}
  .ev-user .who{color:#7ee2a8;justify-content:flex-end}
  .ev-agent{align-self:flex-start}.ev-agent .bubble{background:color-mix(in srgb,var(--p) 14%,transparent);border:1px solid color-mix(in srgb,var(--p) 28%,transparent);border-bottom-left-radius:4px}
  .ev-agent .who{color:var(--p)}
  .tool{align-self:stretch;display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px dashed color-mix(in srgb,var(--a) 45%,transparent);
    border-radius:10px;background:color-mix(in srgb,var(--a) 7%,transparent);font-family:ui-monospace,monospace;font-size:12px;animation:slide .32s ease both,toolflash 1.4s ease}
  @keyframes toolflash{0%{background:color-mix(in srgb,var(--a) 22%,transparent)}100%{background:color-mix(in srgb,var(--a) 7%,transparent)}}
  .tool .ti{width:26px;height:26px;border-radius:.5rem;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a);flex-shrink:0}
  .tool .tn{color:var(--a);font-weight:600}
  .tool .ta{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .tool .tok{margin-left:auto;flex-shrink:0}
  .tool .tok .ok{color:var(--green)}.tool .tok .bad{color:var(--red)}
  .emit{align-self:stretch;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;border-left:3px solid var(--p);
    background:color-mix(in srgb,var(--p) 12%,transparent);font-size:13px;font-weight:600;animation:slide .32s ease both}
  .emit i{color:var(--p)} .emit .arrow{margin-left:auto;color:var(--p)}
  .divider{align-self:center;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding:4px 0}
  .ev-time{font-size:9.5px;color:var(--muted);margin-top:2px}
  .empty{text-align:center;color:var(--muted);padding:16vh 10px}
  .empty .big{font-size:52px;opacity:.4;margin-bottom:10px}
  /* ticket cards */
  #grid{padding:14px 16px;display:flex;flex-direction:column;gap:12px;max-height:74vh;overflow-y:auto}
  #grid::-webkit-scrollbar{width:8px}#grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}
  .card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-left:4px solid var(--p);border-radius:12px;overflow:hidden;animation:slide .35s ease both}
  .card.flash{box-shadow:0 0 0 2px color-mix(in srgb,var(--p) 60%,transparent);animation:slide .35s ease both,unflash 5s ease forwards}
  @keyframes unflash{to{box-shadow:none}}
  .card.done{opacity:.45;filter:saturate(.5)}
  .chead{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .tid{font-weight:800;font-size:16px}
  .badge{font-size:10px;font-weight:800;letter-spacing:.6px;padding:4px 8px;border-radius:6px;text-transform:uppercase}
  .b-pickup{background:rgba(245,165,36,.16);color:var(--pickup);border:1px solid rgba(245,165,36,.4)}
  .b-delivery{background:rgba(59,130,246,.16);color:var(--delivery);border:1px solid rgba(59,130,246,.4)}
  .b-dine_in{background:rgba(34,197,94,.16);color:var(--dine_in);border:1px solid rgba(34,197,94,.4)}
  .b-event{background:rgba(138,151,166,.16);color:#cbd5e1;border:1px solid var(--line)}
  .when{margin-left:auto;font-size:11.5px;color:var(--muted)}
  .cbody{padding:11px 14px}
  .line{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
  .line:last-child{border-bottom:0}
  .qty{font-weight:800;color:#fff;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;min-width:30px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px}
  .iname{font-weight:600}.mods{color:var(--muted);font-size:12px;margin-top:2px}
  .lt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
  .cfoot{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);background:rgba(255,255,255,.03)}
  .total{font-size:20px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
  .total small{font-size:12px;color:var(--muted);font-weight:600}
  .cust{font-size:12px;color:var(--muted);line-height:1.3}
  .bump{margin-left:auto;background:var(--p);color:#0a0b10;border:0;border-radius:8px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer}
  .kv{font-size:13px;line-height:1.6}.kv b{color:#fff}
  .note{margin-top:8px;font-size:12px;color:#fcd34d}
</style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo" id="logo"><i class="fas fa-utensils"></i></div>
      <div><h1 id="bizname">Live Ops</h1><div class="sub" id="bizsub"></div></div></div>
    <span class="pill"><span class="dot" id="dot"></span><span id="connlabel"></span></span>
    <div class="spacer"></div>
    <div class="stats">
      <div class="stat"><b id="s-tickets">0</b><span id="l-tickets"></span></div>
      <div class="stat"><b id="s-tools">0</b><span id="l-tools"></span></div>
      <div class="stat"><b id="s-sales">$0</b><span id="l-sales"></span></div>
    </div>
    <div class="lang" id="lang"><button data-lang="es">ES</button><button data-lang="en">EN</button></div>
    <button class="btn" id="sound"></button>
  </header>

  <main>
    <section class="panel glass">
      <div class="phead"><div class="ic tint"><i class="fas fa-robot"></i></div><h2 id="p-agent"></h2>
        <span class="pill" style="padding:3px 9px"><span class="dot live"></span><span id="agentlive"></span></span>
        <span class="cnt" id="streamcnt"></span></div>
      <div id="stream"></div>
    </section>
    <section class="panel glass">
      <div class="phead"><div class="ic tint"><i class="fas fa-receipt"></i></div><h2 id="p-board"></h2><span class="cnt" id="gridcnt"></span></div>
      <div id="grid"></div>
    </section>
  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const stream = $("stream"), grid = $("grid");

  const I18N = {
    es:{connecting:"conectando…",live:"en vivo",reconnecting:"reconectando…",offline:"sin conexión",
      tickets:"tickets",tools:"tool-calls",sales:"ventas",sound_on:"Sonido ON",sound_off:"Sonido",
      p_agent:"Actividad del agente",p_board:"Tickets · Cocina",agentlive:"pensando en vivo",
      empty_agent:"Esperando el primer mensaje…",empty_board:"Esperando pedidos…",
      customer:"Cliente",agent:"Agente",channel:"canal",bump:"Listo ✓",
      calling:"llamó",emit_ticket:"Ticket emitido",emit_reservation:"Reservación",emit_viewing:"Visita agendada",
      emit_lead:"Prospecto calificado",emit_handoff:"Pasado a humano",reset:"— sesión reiniciada —",
      svc_pickup:"Para llevar",svc_delivery:"Entrega",svc_dine_in:"En sitio",
      t_reservation:"Reservación",t_viewing:"Visita",t_lead:"Prospecto",t_handoff:"A humano",
      k_table:"Mesa",k_people:"personas",k_when:"Cuándo",k_name:"Nombre",k_tel:"Tel",k_folio:"Folio",
      k_property:"Propiedad",k_zone:"Zona",k_operation:"Operación",k_budget:"Presupuesto",k_quality:"Calidad",k_reason:"Motivo",k_summary:"Resumen"},
    en:{connecting:"connecting…",live:"live",reconnecting:"reconnecting…",offline:"offline",
      tickets:"tickets",tools:"tool-calls",sales:"sales",sound_on:"Sound ON",sound_off:"Sound",
      p_agent:"Agent activity",p_board:"Tickets · Kitchen",agentlive:"thinking live",
      empty_agent:"Waiting for the first message…",empty_board:"Waiting for orders…",
      customer:"Customer",agent:"Agent",channel:"channel",bump:"Done ✓",
      calling:"called",emit_ticket:"Ticket emitted",emit_reservation:"Reservation",emit_viewing:"Viewing booked",
      emit_lead:"Lead qualified",emit_handoff:"Handed to human",reset:"— session reset —",
      svc_pickup:"Takeout",svc_delivery:"Delivery",svc_dine_in:"Dine-in",
      t_reservation:"Reservation",t_viewing:"Viewing",t_lead:"Lead",t_handoff:"To human",
      k_table:"Table",k_people:"people",k_when:"When",k_name:"Name",k_tel:"Phone",k_folio:"Ref",
      k_property:"Property",k_zone:"Zone",k_operation:"Operation",k_budget:"Budget",k_quality:"Quality",k_reason:"Reason",k_summary:"Summary"}
  };
  let LANG = (localStorage.getItem("ui_lang")==="en")?"en":"es";
  const t = (k)=> (I18N[LANG][k] ?? k);

  let soundOn=false, audio=null, connState="connecting";
  let tickets=0, toolcalls=0, sales=0, currency="MXN", cfg={};
  const STREAM=[], CARDS=[]; // for re-render on language switch

  const fmt=(n)=>"$"+Number(n||0).toLocaleString(LANG==="en"?"en-US":"es-MX");
  const timeStr=(ms)=>new Date(ms||Date.now()).toLocaleTimeString(LANG==="en"?"en-US":"es-MX",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const kv=(k,v)=> v!==undefined&&v!==null&&v!==""?`<div><b>${k}:</b> ${esc(String(v))}</div>`:"";

  const TOOL_ICON={get_menu:"fa-utensils",add_to_order:"fa-plus",create_order:"fa-receipt",emit_ticket:"fa-ticket",
    book_table:"fa-calendar-check",handoff_human:"fa-headset",get_listings:"fa-city",schedule_viewing:"fa-calendar-day",qualify_lead:"fa-user-check"};

  function fmtArgs(tool,i){
    try{
      i=i||{};
      if(tool==="add_to_order"&&Array.isArray(i.items)) return i.items.map(x=>`${x.qty||1}× ${x.item}`).join(", ");
      if(tool==="get_menu") return [i.categoria,i.q].filter(Boolean).join(" ")||"todo";
      if(tool==="create_order") return [i.type,i.time].filter(Boolean).join(" · ");
      if(tool==="book_table") return [i.size&&i.size+"p",i.datetime].filter(Boolean).join(" · ");
      if(tool==="get_listings") return [i.operacion,i.zona,i.presupuesto_max&&"≤"+fmt(i.presupuesto_max)].filter(Boolean).join(" · ")||"todo";
      if(tool==="schedule_viewing") return [i.listing_id,i.datetime].filter(Boolean).join(" · ");
      if(tool==="qualify_lead") return [i.name,i.operacion,i.presupuesto_max&&fmt(i.presupuesto_max)].filter(Boolean).join(" · ");
      const s=JSON.stringify(i); return s.length>60?s.slice(0,58)+"…":s.replace(/^{}$/,"");
    }catch{return""}
  }

  function applyStatic(){
    $("connlabel").textContent=t(connState);
    $("l-tickets").textContent=t("tickets"); $("l-tools").textContent=t("tools"); $("l-sales").textContent=t("sales");
    $("sound").innerHTML=(soundOn?'<i class="fas fa-bell"></i> ':'<i class="fas fa-bell-slash"></i> ')+t(soundOn?"sound_on":"sound_off");
    $("p-agent").textContent=t("p_agent"); $("p-board").textContent=t("p_board"); $("agentlive").textContent=t("agentlive");
    $("bizsub").textContent=(cfg.industry||"")+" · "+t("channel")+" "+(cfg.channel||"")+" · "+(cfg.tool_pack||"");
    [...$("lang").children].forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));
    document.documentElement.lang=LANG==="en"?"en":"es-MX";
  }
  function setConn(s){connState=s;$("dot").className="dot"+(s==="live"?" live":"");$("connlabel").textContent=t(s);}

  const QBIZ=new URLSearchParams(location.search).get("business");
  let FILTER_BIZ=null;
  fetch("/config"+(QBIZ?"?business="+encodeURIComponent(QBIZ):"")).then(r=>r.json()).then(c=>{
    cfg=c||{}; if(QBIZ) FILTER_BIZ=c.business_name||null;
    if(c.branding&&c.branding.color) document.documentElement.style.setProperty("--p",c.branding.color);
    $("logo").textContent=(c.branding&&c.branding.emoji)||"🍽️";
    $("bizname").textContent=c.business_name||"Live Ops";
    document.title=(c.business_name||"Live Ops")+" · Live";
    currency=c.currency||"MXN"; applyStatic(); renderAll();
  }).catch(()=>{applyStatic();renderAll();});

  $("sound").onclick=()=>{soundOn=!soundOn;applyStatic();if(soundOn&&!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(soundOn&&audio&&audio.state==="suspended")audio.resume();};
  function ding(kind){if(!soundOn||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type="sine";
    o.frequency.value=kind==="ticket"?880:kind==="tool"?520:660;const v=kind==="tool"?0.06:0.22;
    g.gain.setValueAtTime(0.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(v,audio.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+0.3);
    o.start();o.stop(audio.currentTime+0.32);
    if(kind==="ticket"){const o2=audio.createOscillator();o2.connect(g);o2.type="sine";o2.frequency.setValueAtTime(1320,audio.currentTime+0.11);o2.start(audio.currentTime+0.11);o2.stop(audio.currentTime+0.33);}}

  $("lang").addEventListener("click",(ev)=>{const b=ev.target.closest("button");if(!b||b.dataset.lang===LANG)return;LANG=b.dataset.lang;localStorage.setItem("ui_lang",LANG);applyStatic();$("s-sales").textContent=fmt(sales);renderAll();});

  // ── agent stream item ──
  function streamNode(e){
    const {kind,payload:p,at}=e; const d=document.createElement("div"); d.className="ev";
    if(kind==="agent_turn"){d.classList.add("ev-user");d.innerHTML=`<div class="who" style="justify-content:flex-end">${esc(t("customer"))} <i class="fas fa-user"></i></div><div class="bubble">${esc(p.text||"")}</div><div class="ev-time" style="text-align:right">${timeStr(at)}</div>`;}
    else if(kind==="agent_say"){d.classList.add("ev-agent");d.innerHTML=`<div class="who"><i class="fas fa-robot"></i> ${esc(t("agent"))}</div><div class="bubble">${esc(p.text||"").replace(/\n/g,"<br>")}</div>`;}
    else if(kind==="tool_call"){const ic=TOOL_ICON[p.tool]||"fa-screwdriver-wrench";const okI=p.ok?'<i class="fas fa-circle-check ok"></i>':'<i class="fas fa-circle-xmark bad"></i>';
      d.classList.add("tool");d.innerHTML=`<div class="ti"><i class="fas ${ic}"></i></div><div style="min-width:0;flex:1"><span class="tn">${esc(p.tool)}</span> <span class="ta">${esc(fmtArgs(p.tool,p.input))}</span></div><div class="tok">${okI}</div>`;}
    else if(kind==="emit"){d.classList.add("emit");d.innerHTML=`<i class="fas ${p.icon}"></i> ${esc(p.label)} <b>${esc(p.ref||"")}</b>${p.total?" · "+fmt(p.total):""}<span class="arrow"><i class="fas fa-arrow-right"></i></span>`;}
    else if(kind==="reset"){d.classList.add("divider");d.textContent=t("reset");}
    return d;
  }
  function pushStream(e){
    STREAM.push(e); if(STREAM.length>70)STREAM.shift();
    if(stream.querySelector(".empty"))stream.innerHTML="";
    stream.appendChild(streamNode(e));
    while(stream.children.length>70)stream.removeChild(stream.firstChild);
    stream.scrollTop=stream.scrollHeight;
  }

  // ── ticket / event cards ──
  function ticketNode(t0,flash){
    const svc=(t0.service&&t0.service.type)||"pickup";const card=document.createElement("div");card.className="card"+(flash?" flash":"");
    card.innerHTML=`<div class="chead"><span class="tid">${esc(t0.ticket_id||"—")}</span><span class="badge b-${svc}">${t("svc_"+svc)}${t0.service&&t0.service.time?" · "+esc(t0.service.time):""}</span><span class="when">${timeStr(Date.now())}</span></div>
      <div class="cbody">${(t0.items||[]).map(i=>`<div class="line"><div class="qty">${i.qty}×</div><div><div class="iname">${esc(i.name)}</div>${(i.mods&&i.mods.length)?`<div class="mods">${i.mods.map(esc).join(" · ")}</div>`:""}</div><div class="lt">${fmt(i.line_total)}</div></div>`).join("")}
        ${t0.service&&t0.service.address?`<div class="note"><i class="fas fa-location-dot"></i> ${esc(t0.service.address)}</div>`:""}${t0.notes?`<div class="note"><i class="fas fa-pen"></i> ${esc(t0.notes)}</div>`:""}</div>
      <div class="cfoot"><div class="total">${fmt(t0.total)} <small>${esc(t0.currency||currency)}</small></div><div class="cust">${t0.customer&&t0.customer.name?esc(t0.customer.name)+"<br>":""}${t0.customer&&t0.customer.phone?esc(t0.customer.phone):""}</div><button class="bump">${t("bump")}</button></div>`;
    card.querySelector(".bump").onclick=()=>card.classList.toggle("done");return card;
  }
  function eventNode(kind,p,flash){
    const icons={reservation:"fa-calendar-check",viewing:"fa-house",lead:"fa-user-check",handoff:"fa-headset"};
    let rows="";
    if(kind==="reservation")rows=kv(t("k_table"),(p.size!=null?p.size+" "+t("k_people"):""))+kv(t("k_when"),p.datetime)+kv(t("k_name"),p.name)+kv(t("k_tel"),p.tel)+kv(t("k_folio"),p.id);
    else if(kind==="viewing")rows=kv(t("k_property"),p.titulo_es||p.listing_id)+kv(t("k_zone"),p.zona)+kv(t("k_when"),p.datetime)+kv(t("k_name"),p.name)+kv(t("k_tel"),p.tel)+kv(t("k_folio"),p.id);
    else if(kind==="lead")rows=kv(t("k_name"),p.name)+kv(t("k_operation"),p.operacion)+kv(t("k_budget"),p.presupuesto_max?fmt(p.presupuesto_max):"—")+kv(t("k_zone"),p.zona||"—")+kv(t("k_quality"),(p.tier||"").toUpperCase());
    else rows=kv(t("k_reason"),p.reason)+kv(t("k_summary"),p.summary);
    const card=document.createElement("div");card.className="card"+(flash?" flash":"");card.style.borderLeftColor="#8a97a6";
    card.innerHTML=`<div class="chead"><span class="tid"><i class="fas ${icons[kind]||"fa-bell"}"></i> ${esc(p.id||"")}</span><span class="badge b-event">${t("t_"+kind)}</span><span class="when">${timeStr(Date.now())}</span></div><div class="cbody"><div class="kv">${rows}</div></div>`;
    return card;
  }
  function cardNode(type,p,flash){return type==="ticket"?ticketNode(p,flash):eventNode(type,p,flash);}
  function pushCard(type,p){
    if(grid.querySelector(".empty"))grid.innerHTML="";
    CARDS.unshift({type,payload:p});
    grid.insertBefore(cardNode(type,p,true),grid.firstChild);
    $("gridcnt").textContent=CARDS.length;
  }

  function renderAll(){
    stream.innerHTML=""; grid.innerHTML="";
    if(!STREAM.length)stream.innerHTML=`<div class="empty"><div class="big"><i class="fas fa-robot"></i></div><div>${t("empty_agent")}</div></div>`;
    else{STREAM.forEach(e=>stream.appendChild(streamNode(e)));stream.scrollTop=stream.scrollHeight;}
    if(!CARDS.length)grid.innerHTML=`<div class="empty"><div class="big">${(cfg.branding&&cfg.branding.emoji)||"🍽️"}</div><div>${t("empty_board")}</div></div>`;
    else CARDS.forEach(c=>grid.appendChild(cardNode(c.type,c.payload,false)));
    $("streamcnt").textContent=STREAM.length||""; $("gridcnt").textContent=CARDS.length||"";
  }

  const EMIT_META={ticket:{icon:"fa-ticket",label:"emit_ticket"},reservation:{icon:"fa-calendar-check",label:"emit_reservation"},
    viewing:{icon:"fa-house",label:"emit_viewing"},lead:{icon:"fa-user-check",label:"emit_lead"},handoff:{icon:"fa-headset",label:"emit_handoff"}};

  function onEvent(type,p,at){
    if(FILTER_BIZ&&p&&p.business&&p.business!==FILTER_BIZ)return;
    // agentic activity → left stream
    if(type==="agent_turn"||type==="agent_say"){pushStream({kind:type,payload:p,at});return;}
    if(type==="tool_call"){toolcalls++;$("s-tools").textContent=toolcalls;pushStream({kind:type,payload:p,at});ding("tool");return;}
    if(type==="session_reset"){pushStream({kind:"reset",payload:p,at});return;}
    // durable business events → right board + a highlight in the stream
    const m=EMIT_META[type]; if(m){
      const ref=type==="ticket"?(p.ticket_id||""):(p.id||"");
      pushStream({kind:"emit",payload:{icon:m.icon,label:t(m.label),ref,total:type==="ticket"?p.total:null},at});
    }
    if(type==="ticket"){tickets++;sales+=Number(p.total||0);$("s-tickets").textContent=tickets;$("s-sales").textContent=fmt(sales);ding("ticket");pushCard("ticket",p);}
    else if(type==="reservation"||type==="viewing"||type==="lead"||type==="handoff"){ding("event");pushCard(type,p);}
  }

  function connect(){
    const es=new EventSource("/events");
    es.onopen=()=>setConn("live"); es.onerror=()=>setConn("reconnecting");
    es.onmessage=(ev)=>{let e;try{e=JSON.parse(ev.data);}catch{return;}if(!e||!e.type)return;onEvent(e.type,e.payload||{},e.at);};
  }
  applyStatic(); setConn("connecting"); renderAll(); connect();
})();
</script>
</body>
